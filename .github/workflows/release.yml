name: Build and release RepoGit
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  windows:
    # Эти версии публикуются вручную; будущие теги собираются автоматически.
    if: github.ref_name != 'v0.5.0' && github.ref_name != 'v0.6.0' && github.ref_name != 'v0.7.0' && github.ref_name != 'v0.8.0' && github.ref_name != 'v0.9.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check version matches tag
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: node test-github-fixes.cjs
      - run: node test-github-stars.cjs
      - run: node test-library-update.cjs
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/RepoGit-Portable-*-x64.exe
            dist/RepoGit-Setup-*-x64.exe
          if-no-files-found: error
  linux:
    if: github.ref_name != 'v0.5.0' && github.ref_name != 'v0.6.0' && github.ref_name != 'v0.7.0' && github.ref_name != 'v0.8.0' && github.ref_name != 'v0.9.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Check version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: node test-appimage-permissions.cjs
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/repogit-*.x86_64.rpm
          if-no-files-found: error
  mac:
    if: github.ref_name != 'v0.5.0' && github.ref_name != 'v0.6.0' && github.ref_name != 'v0.7.0' && github.ref_name != 'v0.8.0' && github.ref_name != 'v0.9.0'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*-mac.zip
          if-no-files-found: error
  release:
    needs: [windows, linux, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" packages/windows/* packages/linux/* packages/mac/* --verify-tag --generate-notes
